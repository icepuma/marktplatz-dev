name: quarantine

# Fetches, license-checks and scans every skill in quarantine/ that isn't approved yet,
# then opens one promotion PR per passing skill.
on:
  push:
    branches: [main]
    paths: [quarantine/**]
  pull_request:
    paths: [quarantine/**]
  workflow_dispatch:

permissions: {}

concurrency:
  group: quarantine-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.plan.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - id: plan
        run: echo "skills=$(bun scripts/quarantine.ts plan)" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.plan.outputs.skills) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: bun install --frozen-lockfile
      - name: Fetch, license, scan
        run: bun scripts/quarantine.ts check "$SKILL"
        env:
          SKILL: ${{ matrix.skill }}
          GITHUB_TOKEN: ${{ github.token }} # read-only; only used for the license API rate limit
      - name: Job summary
        if: always()
        run: cat ".quarantine/$SKILL/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        env:
          SKILL: ${{ matrix.skill }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-${{ matrix.skill }}
          path: .quarantine/${{ matrix.skill }}
          include-hidden-files: true
          retention-days: 7

  promote:
    needs: [plan, check]
    # Runs even if some skills failed; only the ones that passed have an artifact.
    if: always() && github.event_name != 'pull_request' && needs.plan.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: skill-*
          path: artifacts
      - name: Open one PR per skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          for artifact in artifacts/skill-*; do
            id="${artifact#artifacts/skill-}"
            mkdir -p .quarantine && rm -rf ".quarantine/$id" && cp -r "$artifact" ".quarantine/$id"
            version="$(jq -r .version ".quarantine/$id/provenance.json")"
            branch="promote/$id-$version"

            git switch --quiet -C "$branch" origin/main
            bun scripts/promote.ts "$id"
            # PRs opened with GITHUB_TOKEN don't trigger ci.yml, so run the same checks here.
            bun scripts/verify.ts
            git add "approved/$id/$version"
            git commit --quiet -m "Promote $id@$version"
            git push --force origin "$branch"

            if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
              gh pr create --base main --head "$branch" --title "Promote $id@$version" --body-file ".quarantine/$id/report.md"
            fi
          done
