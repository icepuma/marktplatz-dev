name: preview

# One Cloudflare Worker Preview per pull request that changes the site: a stable URL that follows every push,
# shown on the PR as a deployment of the "preview" environment (and in a comment), deleted when the PR closes.
# Skill PRs (quarantine/, approved/, gate/) merge themselves and don't get one.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - src/**
      - public/**
      - roles/**
      - astro.config.mjs
      - components.json
      - package.json
      - bun.lock
      - tsconfig.json
      - wrangler.jsonc
      - .github/workflows/preview.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}

jobs:
  preview:
    # Secrets are not available to pull requests from forks.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build from the PR head (not the merge commit), so generated marketplace files pin a real commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/verify.ts
      - run: bun run build
      - id: preview
        name: Deploy Preview
        run: |
          set -o pipefail
          output="$(bunx wrangler preview --name "pr-$PR" --message "$SHA" --json)"
          printf '%s\n' "$output"
          # Wrangler prints its upload progress before the JSON; parse from the opening brace, and fail without a URL.
          url="$(printf '%s\n' "$output" | sed -n '/^{/,$p' | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment Preview URL
        run: |
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none \
            --body "🏰 Preview of the market for this PR: $URL (updated for ${SHA:0:7})"
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
          GH_TOKEN: ${{ github.token }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Delete Preview
        run: bunx wrangler preview delete --name "pr-$PR" --skip-confirmation
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
